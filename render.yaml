services:
  - type: web
    name: gvcda-backend
    runtime: node
    rootDir: gvcda-app/backend
    plan: free # no persistent disk needed — the database lives in Supabase Postgres, not on this box
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned to a stable LTS so Render doesn't pick a bleeding-edge Node
      # version some dependency doesn't have prebuilt binaries for.
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false # Supabase project → Settings → Database → Connection string (URI)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # set to your Vercel domain, e.g. https://gvcda.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: gvcda-photos
      # Optional — SMS OTP providers (see ../gvcda-app/GO_LIVE.md §2). Leave unset
      # to keep the fixed dev OTP (123456); the backend refuses to boot without
      # JWT_SECRET but will keep working without these until you're ready for real SMS.
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
